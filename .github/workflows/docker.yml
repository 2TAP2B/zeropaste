name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bundle freshness guard: the binary embeds web/assets/app.js, so a
      # stale committed bundle ships a stale UI - regenerate with the same
      # esbuild the dev shell pins and fail when the committed file differs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y esbuild@0.27.2 --bundle web/ts/app.ts --outfile=web/assets/app.js --minify --target=es2020
      - run: git diff --exit-code -- web/assets/app.js || { echo "::error::web/assets/app.js is stale - regenerate (esbuild) and commit it before tagging"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
