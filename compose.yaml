# zeropaste - plain HTTP app; TLS termination is a reverse-proxy concern.
# This file works as-is: a fully public instance. Every knob lives in the
# environment block, commented, so nothing surprises on `docker compose up -d`.
services:
  paste:
    image: ghcr.io/2tap2b/zeropaste:latest
    ports:
      - "8080:8080"
    volumes:
      - paste-data:/data
    restart: unless-stopped
    # environment:                 # all optional
    #   CREATE_KEY: "change-me"       # site passphrase in front of creates
    #   USER_ACCOUNTS: "true"         # "false" disables accounts entirely
    #   USER_REGISTRATION: "true"     # "false": sign-up closes after the first account
    #   MAX_TTL_DAYS: "30"            # share-time ceiling in days (1..366)
    #   MAX_SHARES_PER_ACCOUNT: "0"   # active shares per account; 0 = unlimited
    #   REG_OPEN: "false"             # static registration lock; sign-ins stay open
    #   MAX_UPLOAD: "104857600"       # bytes per share; default 100 MiB
    #   CHUNK: "8388608"              # bytes per chunk; default 8 MiB

volumes:
  paste-data:
